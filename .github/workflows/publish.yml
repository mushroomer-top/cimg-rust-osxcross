name: Publish image

on:
  workflow_dispatch:
    inputs:
      osxcross_release:
        description: "build_osxcross release/tag"
        required: true
        default: "2024-12-22_17-20-35"
        type: string

      osxcross_file:
        description: "build_osxcross asset file name"
        required: true
        default: "osxcross-full-41f3856-2024-12-22_17-20-35.tar.xz"
        type: string

      image_tag:
        description: "Docker image tag"
        required: true
        default: "latest"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Download osxcross release
        env:
          RELEASE: ${{ inputs.osxcross_release }}
          FILE: ${{ inputs.osxcross_file }}
        run: |
          set -eux
          curl -fL "https://github.com/binarylandia/build_osxcross/releases/download/${RELEASE}/${FILE}" -o osxcross-full.tar.xz

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.image_tag }}
